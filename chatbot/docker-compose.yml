services:
  backend:
    build: ./backend
    ports:
      - "3200:3200"
    environment:
      PORT: "3200"
      RAG_STORE_PATH: /data/rag.db
      INGEST_BASE_URL: "http://host.docker.internal:3100"
      HINDSIGHT_BASE_URL: ""
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      LLM_API_KEY: ""
      SCHEDULER_ENABLED: "true"
      LOG_LEVEL: info
    volumes:
      - rag-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3201:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag-data:
