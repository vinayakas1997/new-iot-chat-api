# Standalone Hindsight memory service (ghcr.io/vectorize-io/hindsight).
# Independent of the app stack: edit .env, then `docker compose up -d` here.
# API :8888, Control Plane UI :9999.
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      # Dummy default boots the service (health + UI live); memory ops need
      # a real key or a local LLM — see .env.example.
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-local-dummy-key}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-}
      # Observations + fan-out caps. The local model server serializes requests,
      # so Hindsight's defaults (32 concurrent LLM calls, 10 worker slots) flood
      # it and queued calls hit the 120s timeout. See .env / the old tuned compose.
      HINDSIGHT_API_ENABLE_OBSERVATIONS: ${HINDSIGHT_API_ENABLE_OBSERVATIONS:-true}
      HINDSIGHT_API_LLM_TIMEOUT: ${HINDSIGHT_API_LLM_TIMEOUT:-900}
      HINDSIGHT_API_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_LLM_MAX_CONCURRENT:-2}
      HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT:-2}
      HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT:-1}
      HINDSIGHT_API_WORKER_MAX_SLOTS: ${HINDSIGHT_API_WORKER_MAX_SLOTS:-2}
      HINDSIGHT_API_WORKER_RETAIN_RESERVED_SLOTS: ${HINDSIGHT_API_WORKER_RETAIN_RESERVED_SLOTS:-1}
      HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS: ${HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS:-1}
      HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: ${HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS:-16384}
      HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS: ${HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS:-2048}
      HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS_PER_OBSERVATION: ${HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS_PER_OBSERVATION:-256}
      HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE: ${HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE:-2}
      HINDSIGHT_API_CONSOLIDATION_LLM_PARALLELISM: ${HINDSIGHT_API_CONSOLIDATION_LLM_PARALLELISM:-1}
      HINDSIGHT_API_CONSOLIDATION_MAX_MEMORIES_PER_ROUND: ${HINDSIGHT_API_CONSOLIDATION_MAX_MEMORIES_PER_ROUND:-20}
      HINDSIGHT_API_CONSOLIDATION_MAX_COMPLETION_TOKENS: ${HINDSIGHT_API_CONSOLIDATION_MAX_COMPLETION_TOKENS:-8192}
      HINDSIGHT_API_LLM_STRICT_SCHEMA_CONSOLIDATION: ${HINDSIGHT_API_LLM_STRICT_SCHEMA_CONSOLIDATION:-true}
      HINDSIGHT_API_LLM_TEMPERATURE_CONSOLIDATION: ${HINDSIGHT_API_LLM_TEMPERATURE_CONSOLIDATION:-0.0}
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: ${HINDSIGHT_API_SKIP_LLM_VERIFICATION:-true}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    shm_size: 1g
    # Reach host-bound local LLMs (e.g. http://host.docker.internal:8009/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  hindsight-data:
