services:
  postgres-rag:
    image: postgres:15-alpine
    container_name: hindsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local trace backend: OTLP HTTP (Hindsight docs — prompts/completions as GenAI span events).
  # UI: http://localhost:16686  → Search → service "hindsight-api" → open a span → GenAI / Events.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hindsight-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8888:8888"
      - "9999:9999"
    depends_on:
      jaeger:
        condition: service_started
    environment:
      # OpenAI-compatible server on the host (vLLM, LM Studio, etc.) — must be reachable from the container.
      - HINDSIGHT_API_LLM_PROVIDER=openai
      - HINDSIGHT_API_LLM_BASE_URL=http://host.docker.internal:8009/v1
      - HINDSIGHT_API_LLM_MODEL=glm-4.7-flash
      - HINDSIGHT_API_LLM_API_KEY=dummy
      # Per-request timeout for chat/completions to your vLLM (docs default 120s is too low for slow retain).
      - HINDSIGHT_API_LLM_TIMEOUT=900
      # Room for long structured JSON; 8k caused finish_reason=length with GLM reasoning output.
      - HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS=16384
      # Match vLLM sweet spot (~2 decodes); higher values queue parallel retains and slow everyone.
      - HINDSIGHT_API_LLM_MAX_CONCURRENT=2
      - HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT=2
      - HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT=1
      # Serialize background jobs so one retain finishes before the next hammers glm-4.7-flash.
      - HINDSIGHT_API_WORKER_RETAIN_MAX_SLOTS=1
      - HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS=1
      # Smaller consolidation prompts → fewer input tokens, faster LLM rounds.
      - HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS=2048
      - HINDSIGHT_API_CONSOLIDATION_SOURCE_FACTS_MAX_TOKENS_PER_OBSERVATION=256
      - HINDSIGHT_API_EMBEDDINGS_PROVIDER=openai
      - HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL=http://host.docker.internal:8006/v1
      - HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL=bge-m3
      - HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY=dummy
      # Use self-hosted bge-reranker (local-hindsight-models.yml :8010). Do NOT use `local` here — startup
      # downloads cross-encoder/ms-marco-MiniLM-L-6-v2 from HuggingFace and crash-loops if HF is unreachable.
      - HINDSIGHT_API_RERANKER_PROVIDER=cohere
      - HINDSIGHT_API_RERANKER_COHERE_API_KEY=dummy
      - HINDSIGHT_API_RERANKER_COHERE_MODEL=bge-reranker-v2-m3
      - HINDSIGHT_API_RERANKER_COHERE_BASE_URL=http://host.docker.internal:8010/v1/rerank
      # OpenTelemetry → Jaeger (see .agents/skills/hindsight-docs/.../configuration.md § Observability)
      - HINDSIGHT_API_OTEL_TRACES_ENABLED=true
      - HINDSIGHT_API_OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - HINDSIGHT_API_OTEL_SERVICE_NAME=hindsight-api
      - HINDSIGHT_API_OTEL_DEPLOYMENT_ENVIRONMENT=development
      # For Langfuse / cloud OTLP: set endpoint + HINDSIGHT_API_OTEL_EXPORTER_OTLP_HEADERS="Authorization=Bearer ..."
      # To disable tracing: HINDSIGHT_API_OTEL_TRACES_ENABLED=false (or remove OTEL_* vars and the jaeger service).
      # to skip the llm verification
      - HINDSIGHT_API_SKIP_LLM_VERIFICATION=true
    volumes:
      - hindsight_data:/home/hindsight/.pg0

  rag-admin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hindsight-rag-admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8765:8765"
    environment:
      HINDSIGHT_RETAIN_TIMEOUT: "900"
      HINDSIGHT_RETAIN_ASYNC: "true"
      RETAIN_OPERATION_POLL_SEC: "2"
      HINDSIGHT_API_BASE: http://hindsight:8888
      # If Hindsight returns 401 on bank create, set the same token the Hindsight UI uses, e.g.:
      # HINDSIGHT_API_KEY: "your-token"
      # or full header: HINDSIGHT_API_AUTH: "Bearer your-token"
      HINDSIGHT_UI_HOST: "192.168.1.101"
      JAEGER_UI_HOST: "192.168.1.101"
      # HINDSIGHT_UI_HOST: "192.168.1.208"
      # JAEGER_UI_HOST: "192.168.1.208"
      # Leave HINDSIGHT_SKIP_UPSTREAM unset so banks created in rag-admin are also created in Hindsight (visible in Hindsight UI).
      # Only set to true for local DB-only testing — Hindsight UI will NOT list those banks. Example: HINDSIGHT_SKIP_UPSTREAM: "true"
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres-rag:5432/ragdb
      MINERU_SERVER: http://host.docker.internal:30000
      MINERU_DPI_SCALE: "2.0"
      OCR_LLM_LABEL: mineru
      UPLOAD_DIR: /data/uploads
      LLM_PAGE_QC_MODELS: glm-4.7-flash
      LLM_PAGE_QC_MODEL: glm-4.7-flash
      LLM_PAGE_QC_BASE_URL: http://host.docker.internal:8009/v1
      LLM_PAGE_QC_API_KEY: dummy
      LLM_PAGE_QC_TIMEOUT: "120"
      LLM_PAGE_QC_MAX_CHARS: "8000"
      LLM_PAGE_QC_MAX_COMPLETION_TOKENS: "4096"
      LLM_PAGE_QC_MAX_ATTEMPTS: "3"
      LLM_PAGE_QC_JSON_MODE: "true"
      LLM_PAGE_QC_PROMPT_VERSION: page_qc_v2
      LLM_PAGE_QC_POLICY: any_reject
      LLM_PAGE_QC_WORKER_ENABLED: "true"
      LLM_PAGE_QC_WORKER_POLL_SEC: "3"
      LLM_PAGE_QC_WORKER_BATCH_SIZE: "5"
      # HINDSIGHT_SKIP_UPSTREAM: "true"
    volumes:
      - rag_uploads:/data/uploads
    depends_on:
      postgres-rag:
        condition: service_healthy
      hindsight:
        condition: service_started

volumes:
  hindsight_data:
  rag_pgdata:
  rag_uploads:
