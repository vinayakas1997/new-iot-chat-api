<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ops · Industrial RAG</title>
    <style>
      body {
        margin: 0;
        background: #0f1115;
        color: #dfe3ec;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      a { color: #8b9cff; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 15px; }
      h2 { font-size: 13px; margin: 24px 0 8px; color: #9aa3b8; text-transform: uppercase; letter-spacing: 0.06em; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #262a34; padding: 6px 8px; text-align: left; vertical-align: top; }
      th { background: #171a21; }
      button { background: #232733; color: #dfe3ec; border: 1px solid #333846; padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
      button:hover { background: #2b3040; }
      input { background: #171a21; color: #dfe3ec; border: 1px solid #333846; padding: 6px 8px; border-radius: 6px; font: inherit; }
      .ok { color: #4bd0a7; }
      .bad { color: #e98a8a; }
      .pill { padding: 1px 6px; border-radius: 5px; border: 1px solid #333846; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
